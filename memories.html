<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Best Memories - Our Moments Together</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            overflow-x: hidden;
        }

        .memories-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            position: relative;
            overflow: hidden;
        }

        .memories-header {
            text-align: center;
            margin-bottom: 2rem;
            z-index: 10;
        }

        .memories-title {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(2.5rem, 6vw, 4rem);
            color: #fff;
            text-shadow: 0 0 10px rgba(236, 72, 153, 0.6), 0 0 20px rgba(236, 72, 153, 0.4), 0 0 30px rgba(236, 72, 153, 0.2);
            animation: titleGlow 2s ease-in-out infinite alternate;
        }

        @keyframes titleGlow {
            from {
                text-shadow: 0 0 10px rgba(236, 72, 153, 0.6), 0 0 20px rgba(236, 72, 153, 0.4), 0 0 30px rgba(236, 72, 153, 0.2);
            }
            to {
                text-shadow: 0 0 15px rgba(236, 72, 153, 0.8), 0 0 25px rgba(236, 72, 153, 0.6), 0 0 40px rgba(236, 72, 153, 0.4);
            }
        }

        .memories-subtitle {
            font-family: 'Dancing Script', cursive;
            font-size: 1.3rem;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 0.5rem;
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 0.8rem 1.5rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-family: 'Dancing Script', cursive;
            font-size: 1.1rem;
            cursor: pointer;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            transition: transform 0.3s, box-shadow 0.3s;
            text-decoration: none;
        }

        .back-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        /* Amazing Floating Photos Container */
        .photos-container {
            position: relative;
            width: 100%;
            max-width: 1200px;
            height: 70vh;
            min-height: 500px;
            perspective: 1500px;
        }

        /* Individual Photo Styles */
        .floating-photo {
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 15px;
            cursor: pointer;
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4), 0 0 0 3px rgba(255, 255, 255, 0.1);
            transform-style: preserve-3d;
        }

        .floating-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .floating-photo::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, transparent 50%);
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 1;
        }

        .floating-photo:hover {
            z-index: 1000 !important;
            transform: scale(1.5) rotate(0deg) !important;
            box-shadow: 0 25px 60px rgba(236, 72, 153, 0.5), 0 0 0 4px rgba(236, 72, 153, 0.6), 0 0 40px rgba(236, 72, 153, 0.4);
        }

        .floating-photo:hover img {
            transform: scale(1.1);
        }

        .floating-photo:hover::before {
            opacity: 1;
        }

        /* Floating Animations */
        @keyframes float1 {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        @keyframes float2 {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-25px) rotate(-5deg); }
        }

        @keyframes float3 {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(3deg); }
        }

        @keyframes gentleBob {
            0%, 100% { transform: translateY(0) translateX(0); }
            25% { transform: translateY(-10px) translateX(5px); }
            50% { transform: translateY(-5px) translateX(-5px); }
            75% { transform: translateY(-15px) translateX(3px); }
        }

        @keyframes swirlIn {
            0% { 
                opacity: 0; 
                transform: scale(0.5) rotateY(180deg);
            }
            100% { 
                opacity: 1; 
                transform: scale(1) rotateY(0deg);
            }
        }

        @keyframes pulse {
            0%, 100% { 
                transform: scale(1);
                filter: brightness(1);
            }
            50% { 
                transform: scale(1.02);
                filter: brightness(1.1);
            }
        }

        @keyframes orbit {
            0% { transform: rotate(0deg) translateX(10px) rotate(0deg); }
            100% { transform: rotate(360deg) translateX(10px) rotate(-360deg); }
        }

        /* Center decoration removed */
        
        /* Photo Preview Modal */
        .photo-preview-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .photo-preview-modal.active {
            display: flex;
            opacity: 1;
        }

        .photo-preview-modal img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 15px;
            box-shadow: 0 0 50px rgba(236, 72, 153, 0.5), 0 0 0 4px rgba(255, 255, 255, 0.3);
            transform: scale(0.8);
            transition: transform 0.3s ease;
            animation: previewGlow 2s ease-in-out infinite;
        }

        .photo-preview-modal.active img {
            transform: scale(1);
        }

        @keyframes previewGlow {
            0%, 100% { box-shadow: 0 0 50px rgba(236, 72, 153, 0.5), 0 0 0 4px rgba(255, 255, 255, 0.3); }
            50% { box-shadow: 0 0 80px rgba(236, 72, 153, 0.8), 0 0 0 6px rgba(255, 255, 255, 0.5); }
        }

        .photo-preview-close {
            position: absolute;
            top: 30px;
            right: 30px;
            font-size: 3rem;
            color: white;
            cursor: pointer;
            transition: transform 0.3s;
            text-shadow: 0 0 20px rgba(236, 72, 153, 0.8);
        }

        .photo-preview-close:hover {
            transform: scale(1.2);
        }

        /* Particle Effects */
        .particles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: rgba(236, 72, 153, 0.6);
            border-radius: 50%;
            animation: particleFloat 15s linear infinite;
        }

        .particle:nth-child(odd) {
            background: rgba(102, 126, 234, 0.6);
        }

        .particle:nth-child(3n) {
            background: rgba(240, 147, 251, 0.6);
        }

        @keyframes particleFloat {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100px) rotate(720deg); opacity: 0; }
        }

        /* Magic sparkles on hover area */
        .sparkle {
            position: absolute;
            width: 10px;
            height: 10px;
            background: radial-gradient(circle, #fff 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            animation: sparkle 1s ease-out forwards;
        }

        @keyframes sparkle {
            0% { transform: scale(0); opacity: 1; }
            50% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0); opacity: 0; }
        }

        /* Instructions */
        .instructions {
            text-align: center;
            margin-top: 1.5rem;
            color: rgba(255, 255, 255, 0.6);
            font-family: 'Dancing Script', cursive;
            font-size: 1.1rem;
            z-index: 10;
        }

        /* Light rays background */
        .light-rays {
            position: fixed;
            inset: 0;
            background: conic-gradient(from 0deg at 50% 50%, 
                transparent 0deg, 
                rgba(236, 72, 153, 0.03) 10deg, 
                transparent 20deg,
                rgba(102, 126, 234, 0.03) 30deg,
                transparent 40deg,
                rgba(240, 147, 251, 0.03) 50deg,
                transparent 60deg,
                rgba(236, 72, 153, 0.03) 70deg,
                transparent 80deg,
                rgba(102, 126, 234, 0.03) 90deg,
                transparent 100deg,
                rgba(240, 147, 251, 0.03) 110deg,
                transparent 120deg,
                rgba(236, 72, 153, 0.03) 130deg,
                transparent 140deg,
                rgba(102, 126, 234, 0.03) 150deg,
                transparent 160deg,
                rgba(240, 147, 251, 0.03) 170deg,
                transparent 180deg,
                rgba(236, 72, 153, 0.03) 190deg,
                transparent 200deg,
                rgba(102, 126, 234, 0.03) 210deg,
                transparent 220deg,
                rgba(240, 147, 251, 0.03) 230deg,
                transparent 240deg,
                rgba(236, 72, 153, 0.03) 250deg,
                transparent 260deg,
                rgba(102, 126, 234, 0.03) 270deg,
                transparent 280deg,
                rgba(240, 147, 251, 0.03) 290deg,
                transparent 300deg,
                rgba(236, 72, 153, 0.03) 310deg,
                transparent 320deg,
                rgba(102, 126, 234, 0.03) 330deg,
                transparent 340deg,
                rgba(240, 147, 251, 0.03) 350deg,
                transparent 360deg
            );
            animation: rotateRays 60s linear infinite;
            z-index: 0;
        }

        @keyframes rotateRays {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .photos-container { height: 60vh; }
            .floating-photo { width: 80px; height: 80px; }
            .center-heart { font-size: 3rem; }
        }

        @media (max-width: 480px) {
            .photos-container { height: 55vh; }
            .floating-photo { width: 65px; height: 65px; }
            .center-heart { font-size: 2.5rem; }
        }
    </style>
</head>
<body>
    <div class="light-rays"></div>
    <div class="particles" id="particles"></div>
    <a href="index_new.html" class="back-btn">← Back</a>
    
    <!-- Photo Preview Modal -->
    <div class="photo-preview-modal" id="photoPreviewModal">
        <span class="photo-preview-close" id="previewClose">&times;</span>
        <img src="" alt="Preview" id="previewImage">
    </div>
    
    <div class="memories-page">
        <div class="memories-header">
            <h1 class="memories-title">Our Beautiful Memories</h1>
            <p class="memories-subtitle">35 magical moments captured in time</p>
        </div>
        
        <div class="photos-container" id="photosContainer">
        </div>
        
        <p class="instructions">✨ Hover or click on photos to see the magic ✨</p>
    </div>

    <script>
        // All 35 photos
        const photos = [
            'photo1.jpeg', 'photo2.jpeg', 'photo3.jpeg', 'photo4.jpeg', 'photo5.jpeg',
            'photo6.jpeg', 'photo7.jpeg', 'photo8.jpeg', 'photo9.jpeg', 'photo10.jpeg',
            'photo11.jpeg', 'photo12.jpeg', 'photo13.jpeg', 'photo14.jpeg', 'photo15.jpeg',
            'photo16.jpeg', 'photo17.jpeg', 'photo18.jpeg', 'photo19.jpeg', 'photo20.jpeg',
            'photo21.jpeg', 'photo22.jpeg', 'photo23.jpeg', 'photo24.jpeg', 'photo25.jpeg',
            'photo26.jpeg', 'photo27.jpeg', 'photo28.jpeg', 'photo29.jpeg', 'photo30.jpeg',
            'photo31.jpeg', 'photo32.jpeg', 'photo33.jpeg', 'photo34.jpeg', 'photo35.jpeg'
        ];

        // Animation types
        const animations = ['float1', 'float2', 'float3', 'gentleBob', 'pulse'];
        const animationDelays = [0, 0.5, 1, 1.5, 2, 2.5, 3, 3.5, 4, 4.5];
        const animationDurations = [4, 5, 6, 7, 8];

        function createFloatingPhotos() {
            const container = document.getElementById('photosContainer');
            const containerWidth = container.offsetWidth;
            const containerHeight = container.offsetHeight;

            // Calculate grid positions for better distribution
            const cols = 7;
            const rows = 5;
            const cellWidth = containerWidth / cols;
            const cellHeight = containerHeight / rows;

            photos.forEach((photo, index) => {
                const photoEl = document.createElement('div');
                photoEl.className = 'floating-photo';
                photoEl.innerHTML = `<img src="${photo}" alt="Memory ${index + 1}">`;
                photoEl.style.opacity = '0';
                
                // Distribute photos in a beautiful pattern
                const col = index % cols;
                const row = Math.floor(index / cols);
                
                // Add some randomness to positions
                const baseX = (col * cellWidth) + (cellWidth / 2) - 60;
                const baseY = (row * cellHeight) + (cellHeight / 2) - 60;
                const offsetX = (Math.random() - 0.5) * 40;
                const offsetY = (Math.random() - 0.5) * 30;

                photoEl.style.left = `${baseX + offsetX}px`;
                photoEl.style.top = `${baseY + offsetY}px`;

                // Random animation
                const anim = animations[index % animations.length];
                const delay = animationDelays[index % animationDelays.length];
                const duration = animationDurations[index % animationDurations.length];
                
                photoEl.style.animation = `${anim} ${duration}s ease-in-out ${delay}s infinite`;
                photoEl.style.animationDelay = `${delay}s`;

                // Add entrance animation
                setTimeout(() => {
                    photoEl.style.transition = 'opacity 0.8s ease, transform 0.8s ease';
                    photoEl.style.opacity = '1';
                    photoEl.style.animation = `${anim} ${duration}s ease-in-out infinite`;
                }, index * 80);

                // Add sparkle on hover
                photoEl.addEventListener('mouseenter', (e) => {
                    createSparkles(e, photoEl);
                });

                container.appendChild(photoEl);
            });
        }

        function createSparkles(event, element) {
            const rect = element.getBoundingClientRect();
            for (let i = 0; i < 8; i++) {
                setTimeout(() => {
                    const sparkle = document.createElement('div');
                    sparkle.className = 'sparkle';
                    sparkle.style.left = `${rect.left + Math.random() * rect.width}px`;
                    sparkle.style.top = `${rect.top + Math.random() * rect.height}px`;
                    sparkle.style.background = Math.random() > 0.5 ? 
                        'radial-gradient(circle, #ff6b6b 0%, transparent 70%)' : 
                        'radial-gradient(circle, #feca57 0%, transparent 70%)';
                    document.body.appendChild(sparkle);
                    setTimeout(() => sparkle.remove(), 1000);
                }, i * 50);
            }
        }

        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = `${Math.random() * 100}vw`;
                particle.style.animationDelay = `${Math.random() * 15}s`;
                particle.style.animationDuration = `${15 + Math.random() * 10}s`;
                particle.style.width = `${4 + Math.random() * 8}px`;
                particle.style.height = particle.style.width;
                container.appendChild(particle);
            }
        }

        // Mouse movement parallax effect
        let mouseX = 0, mouseY = 0;
        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth - 0.5) * 20;
            mouseY = (e.clientY / window.innerHeight - 0.5) * 20;
            
            const photos = document.querySelectorAll('.floating-photo');
            photos.forEach((photo, index) => {
                const depth = (index % 3 + 1) * 0.5;
                const moveX = mouseX * depth;
                const moveY = mouseY * depth;
                const currentTransform = photo.style.transform.split('rotate')[0];
                if (!photo.matches(':hover')) {
                    // Apply subtle parallax when not hovered
                }
            });
        });

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            createFloatingPhotos();
            createParticles();
            initPreviewModal();
        });

        // Photo Preview Modal Functions
        function initPreviewModal() {
            const modal = document.getElementById('photoPreviewModal');
            const previewImg = document.getElementById('previewImage');
            const closeBtn = document.getElementById('previewClose');
            const photos = document.querySelectorAll('.floating-photo');
            
            // Add click event to each photo
            photos.forEach(photo => {
                photo.addEventListener('click', () => {
                    const imgSrc = photo.querySelector('img').src;
                    previewImg.src = imgSrc;
                    modal.classList.add('active');
                });
            });
            
            // Close modal when clicking X
            closeBtn.addEventListener('click', () => {
                modal.classList.remove('active');
            });
            
            // Close modal when clicking outside image
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    modal.classList.remove('active');
                }
            });
            
            // Close modal with Escape key
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && modal.classList.contains('active')) {
                    modal.classList.remove('active');
                }
            });
        }

        // Handle resize
        window.addEventListener('resize', () => {
            const container = document.getElementById('photosContainer');
            const oldPhotos = container.querySelectorAll('.floating-photo');
            oldPhotos.forEach(p => p.remove());
            createFloatingPhotos();
        });
    </script>
</body>
</html>
