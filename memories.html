<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Best Memories - Our Moments Together</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
        }

        .memories-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            overflow-x: hidden;
        }

        .memories-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .memories-title {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(2.5rem, 6vw, 4rem);
            color: #fff;
            text-shadow: 0 0 10px rgba(236, 72, 153, 0.6), 0 0 20px rgba(236, 72, 153, 0.4), 0 0 30px rgba(236, 72, 153, 0.2);
            animation: titleGlow 2s ease-in-out infinite alternate;
        }

        @keyframes titleGlow {
            from {
                text-shadow: 0 0 10px rgba(236, 72, 153, 0.6), 0 0 20px rgba(236, 72, 153, 0.4), 0 0 30px rgba(236, 72, 153, 0.2);
            }
            to {
                text-shadow: 0 0 15px rgba(236, 72, 153, 0.8), 0 0 25px rgba(236, 72, 153, 0.6), 0 0 40px rgba(236, 72, 153, 0.4);
            }
        }

        .memories-subtitle {
            font-family: 'Dancing Script', cursive;
            font-size: 1.3rem;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 0.5rem;
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 0.8rem 1.5rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-family: 'Dancing Script', cursive;
            font-size: 1.1rem;
            cursor: pointer;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            transition: transform 0.3s, box-shadow 0.3s;
            text-decoration: none;
        }

        .back-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .photo-ring-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 500px;
            perspective: 1000px;
        }

        .photo-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform-style: preserve-3d;
            animation: rotateRing 20s linear infinite;
            width: 0;
            height: 0;
        }

        @keyframes rotateRing {
            from { transform: translate(-50%, -50%) rotateY(0deg); }
            to { transform: translate(-50%, -50%) rotateY(360deg); }
        }

        .photo-item {
            position: absolute;
            width: 140px;
            height: 140px;
            left: 50%;
            top: 50%;
            transform-origin: center center;
            cursor: pointer;
            transition: all 0.4s ease;
        }

        .photo-item-inner {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4), 0 0 0 3px rgba(255, 255, 255, 0.1);
            transition: all 0.4s ease;
        }

        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .photo-item:hover {
            z-index: 100;
        }

        .photo-item:hover .photo-item-inner {
            transform: scale(1.3);
            box-shadow: 0 20px 50px rgba(236, 72, 153, 0.5), 0 0 0 4px rgba(236, 72, 153, 0.6), 0 0 30px rgba(236, 72, 153, 0.4);
        }

        .photo-item:hover img {
            transform: scale(1.1);
        }

        .photo-item::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 15px;
            background: linear-gradient(135deg, rgba(255,255,255,0.3) 0%, transparent 50%);
            opacity: 0;
            transition: opacity 0.4s;
            pointer-events: none;
        }

        .photo-item:hover::before {
            opacity: 1;
        }

        .center-decoration {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            z-index: 10;
            cursor: pointer;
            animation: heartBeat 1.5s ease-in-out infinite;
        }

        .center-decoration:hover {
            transform: translate(-50%, -50%) scale(1.15);
            box-shadow: 0 0 50px rgba(236, 72, 153, 0.8), 0 0 100px rgba(236, 72, 153, 0.5);
        }

        .center-decoration::after {
            content: '💕';
            animation: heartFloat 2s ease-in-out infinite;
        }

        @keyframes heartBeat {
            0%, 100% { transform: translate(-50%, -50%) scale(1); box-shadow: 0 0 30px rgba(236, 72, 153, 0.5), 0 0 60px rgba(236, 72, 153, 0.3); }
            15% { transform: translate(-50%, -50%) scale(1.1); box-shadow: 0 0 40px rgba(236, 72, 153, 0.7), 0 0 80px rgba(236, 72, 153, 0.5); }
            30% { transform: translate(-50%, -50%) scale(1); box-shadow: 0 0 30px rgba(236, 72, 153, 0.5), 0 0 60px rgba(236, 72, 153, 0.3); }
            45% { transform: translate(-50%, -50%) scale(1.1); box-shadow: 0 0 40px rgba(236, 72, 153, 0.7), 0 0 80px rgba(236, 72, 153, 0.5); }
            60%, 100% { transform: translate(-50%, -50%) scale(1); box-shadow: 0 0 30px rgba(236, 72, 153, 0.5), 0 0 60px rgba(236, 72, 153, 0.3); }
        }

        @keyframes heartFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .floating-hearts {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }

        .floating-heart {
            position: absolute;
            color: rgba(236, 72, 153, 0.3);
            font-size: 2rem;
            animation: floatHeart 8s ease-in-out infinite;
        }

        @keyframes floatHeart {
            0%, 100% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-20vh) rotate(20deg); opacity: 0; }
        }

        .instructions {
            text-align: center;
            margin-top: 1.5rem;
            color: rgba(255, 255, 255, 0.6);
            font-family: 'Dancing Script', cursive;
            font-size: 1.1rem;
        }

        @media (max-width: 768px) {
            .photo-ring-container { height: 400px; }
            .photo-item { width: 100px; height: 100px; }
            .center-decoration { width: 80px; height: 80px; font-size: 2.5rem; }
        }

        @media (max-width: 480px) {
            .photo-ring-container { height: 350px; }
            .photo-item { width: 80px; height: 80px; }
            .center-decoration { width: 60px; height: 60px; font-size: 2rem; }
        }
    </style>
</head>
<body>
    <div class="floating-hearts" id="heartsContainer"></div>
    <a href="index_new.html" class="back-btn">← Back</a>
    <div class="memories-page">
        <div class="photo-ring-container">
<!-- Center heart decoration removed -->
            <div class="photo-ring" id="photoRing"></div>
    </div>
    <script>
        // Using your actual photos from the Trial folder (including photo8)
        const photos = [
            { img: 'photo1.jpeg', angle: 0 },
            { img: 'photo2.jpeg', angle: 45 },
            { img: 'photo3.jpeg', angle: 90 },
            { img: 'photo4.jpeg', angle: 135 },
            { img: 'photo5.jpeg', angle: 180 },
            { img: 'photo6.jpeg', angle: 225 },
            { img: 'photo7.jpeg', angle: 270 },
            { img: 'photo8.jpeg', angle: 315 }
        ];

        function createPhotoRing() {
            const ring = document.getElementById('photoRing');
            const radius = 220;
            photos.forEach(function(photo) {
                const angleRad = (photo.angle * Math.PI) / 180;
                const x = Math.cos(angleRad) * radius;
                const y = Math.sin(angleRad) * radius;
                const photoItem = document.createElement('div');
                photoItem.className = 'photo-item';
                photoItem.style.transform = 'translate(-50%, -50%) translate(' + x + 'px, ' + y + 'px) rotateY(' + photo.angle + 'deg)';
                photoItem.innerHTML = '<div class="photo-item-inner"><img src="' + photo.img + '" alt="Memory"></div>';
                ring.appendChild(photoItem);
            });
        }

        function createFloatingHearts() {
            const container = document.getElementById('heartsContainer');
            const hearts = ['❤️', '💖', '💗', '💕', '💝', '💘'];
            for (let i = 0; i < 15; i++) {
                const heart = document.createElement('div');
                heart.className = 'floating-heart';
                heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDelay = Math.random() * 8 + 's';
                heart.style.animationDuration = (Math.random() * 4 + 6) + 's';
                container.appendChild(heart);
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            createPhotoRing();
            createFloatingHearts();
        });
    </script>
</body>
</html>
